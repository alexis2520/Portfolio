    <!-- 3. VISIONNEUSE PLEIN ÉCRAN (LIGHTBOX) -->
    <!-- J'ai ajouté (event) dans closeLightbox pour gérer le clic sur le fond -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
        <span class="close-btn">&times;</span>
        
        <!-- Nouvelles flèches de navigation -->
        <span class="lightbox-nav left" onclick="changeImage(-1)">&#10094;</span>
        <img id="lightbox-img" src="" alt="Photo agrandie">
        <span class="lightbox-nav right" onclick="changeImage(1)">&#10095;</span>
    </div>

    <script>
        let currentIndex = 0;
        let imagesArray = [];
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        // Ouvre la lightbox
        function openLightbox(element) {
            // Récupère toutes les images de la grille pour savoir combien il y en a
            imagesArray = Array.from(document.querySelectorAll('.pixieset-grid img'));
            
            // Trouve le numéro (l'index) de l'image cliquée
            currentIndex = imagesArray.indexOf(element);
            
            updateImage();
            lightbox.classList.add('active');
        }

        // Ferme la lightbox (uniquement si on clique sur le fond noir ou la croix)
        function closeLightbox(event) {
            if (!event || event.target.id === 'lightbox' || event.target.classList.contains('close-btn')) {
                lightbox.classList.remove('active');
            }
        }

        // Change l'image (direction = 1 pour suivant, -1 pour précédent)
        function changeImage(direction) {
            let newIndex = currentIndex + direction;
            
            // On vérifie si on ne dépasse pas le début (0) ou la fin de la liste d'images
            if (newIndex >= 0 && newIndex < imagesArray.length) {
                currentIndex = newIndex;
                updateImage();
            }
            // Si on est aux limites, la fonction ne fait rien (pas de boucle)
        }

        // Met à jour la source de l'image
        function updateImage() {
            lightboxImg.src = imagesArray[currentIndex].src;
        }

        // --- Écoute du clavier (Flèches et Échap) ---
        document.addEventListener('keydown', function(event) {
            if (lightbox.classList.contains('active')) {
                if (event.key === 'ArrowRight') {
                    changeImage(1); // Suivant
                } else if (event.key === 'ArrowLeft') {
                    changeImage(-1); // Précédent
                } else if (event.key === 'Escape') {
                    closeLightbox(); // Fermer
                }
            }
        });
    </script>
